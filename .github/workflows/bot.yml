name: Bot Alertas Bolsa

on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar mensaje de prueba a Telegram"
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: bot-alertas
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests feedparser

      - name: Restaurar historial de alertas
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ENVIAR_PRUEBA: ${{ inputs.prueba }}
        run: python main.py
